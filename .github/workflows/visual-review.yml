# Visual review in Argos (docs/visual-review.md).
# Runs after every successful Vercel deploy:
#   - Production → screenshots of the live site become the baseline (branch main).
#   - Preview (PR) → screenshots of the preview are compared with that baseline;
#     Argos posts a check on the PR and every changed page is reviewed side by
#     side / slider / diff in app.argos-ci.com before the PR goes live.
name: Visual review

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: visual-review-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  argos:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.deployment.sha }}
      ENVIRONMENT: ${{ github.event.deployment.environment }}
      DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Where does this deploy belong?
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ENVIRONMENT" = "Production" ]; then
            # Public alias = what visitors see; no bypass needed.
            echo "url=https://2026.wedance.vip" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
          else
            q='[.[] | select(.state=="open")][0]'
            echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
            echo "branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq "$q.head.ref // empty")" >> "$GITHUB_OUTPUT"
            echo "pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq "$q.number // empty")" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip previews without an open PR
        id: gate
        run: |
          if [ "$ENVIRONMENT" != "Production" ] && [ -z "${{ steps.target.outputs.pr }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No open PR for $SHA — nothing to review."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'

      - uses: actions/cache@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - if: steps.gate.outputs.run == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Screenshot and upload to Argos
        if: steps.gate.outputs.run == 'true'
        run: bunx playwright test -c playwright.argos.config.ts
        env:
          CI: 'true'
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          ARGOS_BASE_URL: ${{ steps.target.outputs.url }}
          ARGOS_PREVIEW_BASE_URL: ${{ steps.target.outputs.url }}
          ARGOS_COMMIT: ${{ github.event.deployment.sha }}
          ARGOS_BRANCH: ${{ steps.target.outputs.branch }}
          ARGOS_PR_NUMBER: ${{ steps.target.outputs.pr }}
          ARGOS_REFERENCE_BRANCH: main
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
